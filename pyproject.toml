[project]
name = "crucible"
version = "0.1.0"
description = "Certified product data enrichment for industrial catalogs — AI-generated attributes with a guaranteed error rate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vishal K" }]

dependencies = [
    "pydantic>=2.9",
    "pint>=0.24",            # dimensional algebra verifier
    "numpy>=2.1",
    "scipy>=1.14",           # Clopper-Pearson intervals for conformal certification
    "scikit-learn>=1.5",     # calibrated nonconformity scorer
    "duckdb>=1.1",
    "typer>=0.15",
    "rich>=13.9",
    "pyyaml>=6.0",
    "openpyxl>=3.1",         # XLSX delivery file; CSV path works without it
    "ollama>=0.6.2",
    "google-genai>=2.19.0",
    "pymupdf>=1.28.2",
    "torch>=2.9.1",
    "transformers>=5.15.1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # File upload arrives as multipart form data; FastAPI raises at import without it.
    "python-multipart>=0.0.9",
]
models = ["transformers>=4.46", "torch>=2.9.1", "sentence-transformers>=3.3"]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]

[project.scripts]
crucible = "crucible.cli:app"
crucible-app = "crucible.api.app:main"

# CUDA 12.8 wheels. Blackwell (RTX 50-series, sm_120) requires 12.8 or newer, and
# the Windows CUDA wheels top out at torch 2.9.x on this index - hence the pin below
# rather than the newer CPU-only build available on PyPI.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer declares CLI arguments as call-valued defaults; that is the framework's API,
# not the mutable-default bug B008 exists to catch.
"src/crucible/cli.py" = ["B008"]
# FastAPI declares request parameters the same way - File(), Query(), Depends() are its
# API, and the values are immutable markers rather than the shared mutable defaults B008
# is about.
"src/crucible/api/app.py" = ["B008"]
# The static-site builder embeds an HTML template as a string literal. Wrapping markup to
# 100 columns would make it less readable, not more, and it is not Python being read.
"tools/build_static_site.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
