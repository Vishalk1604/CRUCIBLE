[project]
name = "crucible"
version = "0.1.0"
description = "Certified product data enrichment for industrial catalogs — AI-generated attributes with a guaranteed error rate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vishal K" }]

dependencies = [
    "pydantic>=2.9",
    "pint>=0.24",            # dimensional algebra verifier
    "numpy>=2.1",
    "scipy>=1.14",           # Clopper-Pearson intervals for conformal certification
    "scikit-learn>=1.5",     # calibrated nonconformity scorer
    "duckdb>=1.1",
    "typer>=0.15",
    "rich>=13.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
models = ["transformers>=4.46", "torch>=2.5", "sentence-transformers>=3.3"]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]

[project.scripts]
crucible = "crucible.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
