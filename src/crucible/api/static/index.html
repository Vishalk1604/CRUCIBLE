<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crucible</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --line: #262c36;
    --ink: #e6edf3; --dim: #8b949e; --faint: #6e7681;
    --ok: #3fb950; --warn: #d29922; --bad: #f85149; --accent: #58a6ff;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 32px 24px 72px; }

  header { border-bottom: 1px solid var(--line); padding-bottom: 20px; margin-bottom: 28px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; }
  h1 span { color: var(--faint); font-weight: 400; }
  .sub { color: var(--dim); margin-top: 6px; font-size: 14px; }

  .banner {
    margin-top: 14px; padding: 9px 13px; border-radius: 6px; font-size: 13px;
    background: rgba(210,153,34,.1); border: 1px solid rgba(210,153,34,.35); color: #e3b341;
  }

  .grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 22px; align-items: start; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 22px; }
  .panel h2 {
    margin: 0 0 4px; font-size: 12px; text-transform: uppercase;
    letter-spacing: .09em; color: var(--dim); font-weight: 600;
  }
  .panel .note { color: var(--faint); font-size: 12.5px; margin: 0 0 18px; }

  .dial-value { font: 600 46px/1 var(--mono); letter-spacing: -.02em; margin: 10px 0 2px; }
  .dial-label { color: var(--dim); font-size: 13px; margin-bottom: 20px; }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 26px; }
  .ticks { display: flex; justify-content: space-between; color: var(--faint); font: 11px var(--mono); margin-top: -2px; }

  .headline { margin: 22px 0 4px; font-size: 34px; font-weight: 600; font-family: var(--mono); letter-spacing: -.02em; }
  .headline.ok { color: var(--ok); }
  .headline.bad { color: var(--bad); }
  .headline-sub { color: var(--dim); font-size: 13.5px; min-height: 40px; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line);
           border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-top: 20px; }
  .stat { background: var(--panel); padding: 13px 14px; }
  .stat .k { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .stat .v { font: 600 19px var(--mono); margin-top: 3px; }

  .bar { height: 9px; border-radius: 5px; background: var(--line); overflow: hidden; display: flex; margin-top: 18px; }
  .bar i { display: block; height: 100%; }
  .bar .pub { background: var(--ok); }
  .bar .rev { background: var(--warn); }
  .legend { display: flex; gap: 18px; margin-top: 9px; font-size: 12px; color: var(--dim); }
  .legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; margin-right: 6px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--faint); font-weight: 500; font-size: 11px;
       text-transform: uppercase; letter-spacing: .06em; padding: 7px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.mono { font-family: var(--mono); font-size: 12.5px; }
  tr:last-child td { border-bottom: 0; }
  .tag { font: 11px var(--mono); padding: 1px 6px; border-radius: 4px; }
  .tag.err { background: rgba(248,81,73,.15); color: var(--bad); }
  .tag.fine { background: rgba(63,185,80,.13); color: var(--ok); }
  .detail { color: var(--faint); font-size: 11.5px; margin-top: 3px; }
  .scroll { overflow-x: auto; }
  .empty { color: var(--faint); font-size: 13px; padding: 18px 0; }
  .loading { color: var(--dim); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Crucible <span>· certified product data</span></h1>
    <div class="sub">Local inference. Nothing leaves this machine.</div>
    <div class="banner" id="banner">Loading…</div>
  </header>

  <div id="app" class="loading">Building session…</div>
</div>

<script>
const $ = (s, r=document) => r.querySelector(s);
const pct = x => (x*100).toFixed(1) + '%';
const pct0 = x => Math.round(x*100) + '%';

let STOPS = [], SWEEP = [], STATS = null, idx = 4;

async function boot() {
  try {
    const [stats, sweep] = await Promise.all([
      fetch('/api/stats').then(r => r.json()),
      fetch('/api/sweep').then(r => r.json()),
    ]);
    STATS = stats; STOPS = sweep.stops; SWEEP = sweep.results;
    idx = Math.max(0, STOPS.indexOf(0.05));
    render();
  } catch (e) {
    $('#app').innerHTML = '<div class="empty">Could not load session: ' + e + '</div>';
  }
}

function render() {
  $('#banner').textContent =
    'Synthetic corpus — ' + STATS.nProducts + ' generated products, ' + STATS.nValues +
    ' values. Extraction by ' + STATS.model + '. These numbers demonstrate the method, ' +
    'not performance on a real catalog.';

  $('#app').className = '';
  $('#app').innerHTML = `
    <div class="grid">
      <div class="panel">
        <h2>Maximum acceptable error rate</h2>
        <p class="note">The one control. Everything below follows from it.</p>
        <div class="dial-value" id="alpha">—</div>
        <div class="dial-label">of auto-published values may be wrong</div>
        <input type="range" id="dial" min="0" max="${STOPS.length-1}" step="1" value="${idx}">
        <div class="ticks">${STOPS.map(s => '<span>'+(s*100).toFixed(s<0.01?1:0)+'%</span>').join('')}</div>

        <div class="headline" id="headline">—</div>
        <div class="headline-sub" id="headlineSub"></div>

        <div class="bar"><i class="pub" id="barPub"></i><i class="rev" id="barRev"></i></div>
        <div class="legend">
          <span><i class="pub" style="background:var(--ok)"></i>auto-published</span>
          <span><i class="rev" style="background:var(--warn)"></i>routed to review</span>
        </div>

        <div class="stats">
          <div class="stat"><div class="k">Certified bound</div><div class="v" id="bound">—</div></div>
          <div class="stat"><div class="k">Realised error</div><div class="v" id="realized">—</div></div>
          <div class="stat"><div class="k">Unverified baseline</div><div class="v" id="baseline">—</div></div>
        </div>
      </div>

      <div class="panel">
        <h2>Does the guarantee hold?</h2>
        <p class="note">Promised versus realised on held-out data. Points on or below the
        diagonal are promises kept.</p>
        <div id="chart"></div>
        <div class="stats" style="grid-template-columns:repeat(2,1fr)">
          <div class="stat"><div class="k">Scorer AUROC</div><div class="v">${STATS.auroc.toFixed(3)}</div></div>
          <div class="stat"><div class="k">Held-out values</div><div class="v">${STATS.nTest}</div></div>
        </div>
      </div>
    </div>

    <div class="panel" style="margin-top:22px">
      <h2>Routed to review</h2>
      <p class="note">Most suspect first, with the evidence behind each decision.</p>
      <div class="scroll" id="queue"><div class="empty">—</div></div>
    </div>
  `;

  $('#dial').addEventListener('input', e => { idx = +e.target.value; update(); });
  drawChart();
  update();
}

function update() {
  const r = SWEEP[idx];
  $('#alpha').textContent = (r.alpha*100).toFixed(r.alpha < 0.01 ? 1 : 0) + '%';

  if (!r.feasible) {
    $('#headline').className = 'headline bad';
    $('#headline').textContent = 'Cannot certify';
    $('#headlineSub').textContent = r.reason;
    $('#barPub').style.width = '0%'; $('#barRev').style.width = '100%';
    $('#bound').textContent = '—';
    $('#realized').textContent = '—';
  } else {
    $('#headline').className = 'headline ok';
    $('#headline').textContent = pct(r.automationRate) + ' auto-published';
    $('#headlineSub').textContent =
      r.nAutoPublished.toLocaleString() + ' of ' + r.nTotal.toLocaleString() +
      ' values published without human review, certified at or below ' +
      pct0(r.alpha) + ' error with 95% confidence. ' +
      r.nReview.toLocaleString() + ' routed to a person.';
    $('#barPub').style.width = (r.automationRate*100) + '%';
    $('#barRev').style.width = ((1-r.automationRate)*100) + '%';
    $('#bound').textContent = r.certifiedBound == null ? '—' : pct(r.certifiedBound);
    $('#realized').textContent = pct(r.realizedError);
  }
  $('#baseline').textContent = pct(r.baselineError);
  drawChart();
  loadQueue(r.alpha);
}

function drawChart() {
  const W = 300, H = 210, P = 34;
  const max = Math.max(...STOPS, 0.16);
  const x = v => P + (v/max) * (W - P - 10);
  const y = v => H - P - (v/max) * (H - P - 12);

  const pts = SWEEP.filter(r => r.feasible);
  const dots = pts.map(r => {
    const cx = x(r.alpha), cy = y(r.realizedError);
    const held = r.realizedError <= r.alpha;
    const fill = held ? 'var(--ok)' : 'var(--bad)';
    const cur = SWEEP[idx].alpha === r.alpha;
    return `<circle cx="${cx}" cy="${cy}" r="${cur?6:4}" fill="${fill}"
             stroke="${cur?'#fff':'none'}" stroke-width="${cur?2:0}"/>`;
  }).join('');

  const line = pts.map((r,i) => (i?'L':'M') + x(r.alpha) + ' ' + y(r.realizedError)).join(' ');

  $('#chart').innerHTML = `
  <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">
    <defs><pattern id="g" width="1" height="1"></pattern></defs>
    <line x1="${P}" y1="${H-P}" x2="${W-10}" y2="${H-P}" stroke="var(--line)"/>
    <line x1="${P}" y1="12" x2="${P}" y2="${H-P}" stroke="var(--line)"/>
    <line x1="${x(0)}" y1="${y(0)}" x2="${x(max)}" y2="${y(max)}"
          stroke="var(--faint)" stroke-dasharray="4 4" stroke-width="1"/>
    <text x="${x(max)-4}" y="${y(max)-7}" fill="var(--faint)" font-size="9" text-anchor="end">promise = reality</text>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="1.5" opacity=".55"/>
    ${dots}
    <text x="${(W+P)/2}" y="${H-6}" fill="var(--faint)" font-size="10" text-anchor="middle">promised error rate</text>
    <text x="10" y="${(H-P)/2}" fill="var(--faint)" font-size="10" text-anchor="middle"
          transform="rotate(-90 10 ${(H-P)/2})">realised</text>
  </svg>`;
}

async function loadQueue(alpha) {
  const el = $('#queue');
  try {
    const d = await fetch('/api/review?alpha=' + alpha + '&limit=14').then(r => r.json());
    if (!d.items.length) { el.innerHTML = '<div class="empty">Nothing routed to review.</div>'; return; }
    el.innerHTML = `<table>
      <thead><tr><th>SKU</th><th>Attribute</th><th>Extracted</th><th>Expected</th>
      <th>Score</th><th>Why it was flagged</th></tr></thead><tbody>
      ${d.items.map(it => `<tr>
        <td class="mono">${it.sku}</td>
        <td>${it.attribute}</td>
        <td class="mono">${esc(it.extracted)}</td>
        <td class="mono" style="color:var(--dim)">${esc(it.expected)}</td>
        <td class="mono">${it.nonconformity.toFixed(2)}
          <span class="tag ${it.isError?'err':'fine'}">${it.isError?'wrong':'ok'}</span></td>
        <td>${it.signals.filter(s=>s.applicable && s.trust<1).map(s =>
              `<div class="detail"><b style="color:var(--dim)">${s.verifier}</b> ${esc(s.detail)}</div>`
            ).join('') || '<span class="detail">low agreement across verifiers</span>'}</td>
      </tr>`).join('')}
      </tbody></table>`;
  } catch (e) { el.innerHTML = '<div class="empty">' + e + '</div>'; }
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

boot();
</script>
</body>
</html>
