# The taxonomy the router assigns, and the source of the four classification columns.
#
# Authored by reading the 1000-row sample, not by imagining what a distributor sells.
# Every keyword below appears in that file; the counts in each comment are the number of
# descriptions containing the node's strongest term. Nodes are ordered roughly by
# population so the file reads as a picture of the catalog.
#
# Two taxonomies, deliberately:
#   dept / klass / fine  - the three flat columns the sheet wants
#   classpath            - a separate ">"-delimited path
# In the reference sheet these disagree - Appliances / Large Appliances / Dishwashers
# against "Appliances & Consumer Electronics>Kitchen Appliances>Built-In Dishwashers" -
# so they are stored as independent fields rather than one derived from the other.
#
# `strong` terms are near-decisive for the node, `keywords` are supporting evidence, and
# `negative` terms disqualify it outright. The split matters: "light" alone is weak
# because it appears in both bulbs and fixtures, while "highbay" is decisive. A node that
# wins on weak evidence alone is exactly the routing the cascade should hand upward
# rather than commit to.

- category_id: decking.board
  dept: Building Materials
  klass: Decking & Railing
  fine: Composite & PVC Decking
  classpath: Building Materials>Decking & Porch>Deck Boards
  unspsc: "30103604"
  strong: [decking, deckboard]
  keywords: [grooved, sq, edge, fascia, azek, trex, timbertech, pvc, composite, transcend, enhance, select, vintage, harvest, naturals, lineage, basics, reserve]
  patterns:
    - '\b\d+n?x\d+-\d+''' # 1x6-20', 1nx6-16'
  # "gate" was here as a disqualifier and cost a real board: "1x12-12' Castle Gate -
  # Landmark Azek PVC Fascia" is decking whose *colour* is Castle Gate. Colour names in
  # this catalog collide freely with hardware nouns (Harvest, Reserve, Vintage), so
  # disqualifiers have to be terms that never appear as a finish.
  negative: [baluster, balusters]

- category_id: decking.railing
  dept: Building Materials
  klass: Decking & Railing
  fine: Railing Systems & Components
  classpath: Building Materials>Decking & Porch>Railing
  unspsc: "30151800"
  # "rail" is decisive, not supporting. As a keyword it left "Assembled Black Rail Panel"
  # one point ahead of decking.board - which was scoring on the TREX in the brand column -
  # and a one-point lead inside the same product family reads as a tie, so the router
  # refused a row it should have been sure about.
  strong: [baluster, balusters, railing, rail]
  keywords: [post, horiz, kit, panel, alum, bracket, gate, newel, t-rail, finyline, rdi, cap]
  patterns:
    - '\brail\b'
    - '\bpost\b'
  negative: [decking, light, lamp]

- category_id: lamp.led
  dept: Electrical
  klass: Lamps & Bulbs
  fine: LED Lamps
  classpath: Electrical>Lighting>Lamps & Bulbs>LED Lamps
  unspsc: "39101605"
  strong: [led]
  keywords: [med, cand, lamp, bulb, retro, dimmable, flood, gu10, e26, filament]
  patterns:
    - '\b\d{1,3}\s?[wW]\b'      # 8W, 40W
    - '\b\d{2}[kK]\b'           # 27k, 50k colour temperature
    - '\b(A19|A21|BR30|BR40|PAR16|PAR20|PAR30|PAR38|T8|T9|T12|B11|ST19|MR16|G25)\b'
  negative: [highbay, chandelier, pendant, sconce, decking, rail]

