  # Tool nouns are decisive; brand names are not. "Milw" was strong here and it made
  # "Milw 4-1/2\"x1/8\"x5/8-11\" Metal Cut Off" a tie between this node and the cut-off
  # disc, because Milwaukee sells both the grinder and the wheel. A brand narrows a
  # catalog, it does not name a product.
  strong: [drill, driver, impact, wrench, grinder, sander, nailer, ratchet, blower]
  keywords: [m12, m18, dewalt, milw, makita, festool, kreg, saw, grease, gun, kit, bare, tool, only, brushless, vac, cordless, hammer]
  patterns:
    - '\b(12|18|20|40|60)\s?V\b'
  negative: [decking, baluster, lamp, bulb]

