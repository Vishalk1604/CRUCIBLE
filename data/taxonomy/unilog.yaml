- category_id: abrasive.cutoff_disc
  dept: Tools & Equipment
  klass: Power Tool Accessories
  fine: Cut-Off & Grinding Wheels
  classpath: Tools & Equipment>Power Tool Accessories>Abrasive Wheels
  unspsc: "23101500"
  strong: [cut-off, cutoff]
  # "off" must be quoted: YAML 1.1 reads the bare token as boolean false, which reached
  # pydantic as False and failed validation. on/off/yes/no all have this problem.
  keywords: [cut, "off", disc, wheel, grinding, metal, steel, demon, dko, abrasive, diablo]
  patterns:
    - '\bcut[\s-]?off\b'
    - '\b\d+(?:-\d+/\d+)?"x[\d./]+"x[\d./]+"'   # 5"x.045"x7/8"
  negative: [sanding, belt, blade, decking]

