# ---------------------------------------------------------------------------------------
# Categories the 1000-row sample does not contain, added for the evaluation set.
#
# The Solution Guide specifies Faucets and Fittings end to end and calls them the ideal
# demo scope, which makes them the two most likely to appear in unseen data. A stress test
# on an unfamiliar catalog routed 1 of 10 products; every node below closes part of that
# gap. Keywords come from ordinary trade vocabulary rather than from the sample, and are
# marked as such so nobody later mistakes them for measured terms.
# ---------------------------------------------------------------------------------------

